        <title>Document</title>

    <body>
        <button id="node">node</button>
        <script>
            node.addEventListener('click', event => {
                console.log('冒泡')
            }, false)
            node.addEventListener('click', event => {
                event.stopImmediatePropagation()
                // event.stopPropagation()
                console.log('捕获 ')
            }, true)

            node.addEventListener('click', event => {
                // event.stopImmediatePropagation() event.stopPropagation()

            }, true)
        </script>
    </body>
