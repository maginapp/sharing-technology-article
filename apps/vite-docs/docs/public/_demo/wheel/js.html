<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>转盘抽奖动画</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        p {
            color: #666;
            margin-bottom: 40px;
        }
        
        .turntable-container {
            position: relative;
            margin: 0 auto;
            max-width: 400px;
            width: 80vw;
            aspect-ratio: 1/1;
        }
        
        .turntable {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 8px solid white;
            transform-origin: center;
            transition: transform 0.05s linear;
        }
        
        .prize-section {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center;
            padding-top: 20%;
            font-weight: bold;
            color: white;
        }
        
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
        }
        
        .spin-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        
        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        
        .spin-btn i {
            font-size: 24px;
            color: #3B82F6;
        }
        
        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #3B82F6;
            border-radius: 2px;
            z-index: 10;
        }
        
        .result-container {
            margin-top: 40px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            display: none;
        }
        
        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .prize-result {
            font-size: 28px;
            font-weight: bold;
            color: #3B82F6;
        }
        
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        /* 转盘颜色 */
        .sector-1 { background: linear-gradient(45deg, #3B82F6, #60A5FA); transform: rotate(0deg); }
        .sector-2 { background: linear-gradient(45deg, #F59E0B, #FBBF24); transform: rotate(45deg); }
        .sector-3 { background: linear-gradient(45deg, #EC4899, #F472B6); transform: rotate(90deg); }
        .sector-4 { background: linear-gradient(45deg, #10B981, #34D399); transform: rotate(135deg); }
        .sector-5 { background: linear-gradient(45deg, #8B5CF6, #A78BFA); transform: rotate(180deg); }
        .sector-6 { background: linear-gradient(45deg, #EAB308, #FACC15); transform: rotate(225deg); }
        .sector-7 { background: linear-gradient(45deg, #EF4444, #F87171); transform: rotate(270deg); }
        .sector-8 { background: linear-gradient(45deg, #6B7280, #9CA3AF); transform: rotate(315deg); }
        
        /* 转盘文本旋转 */
        .prize-1 { transform: rotate(22.5deg); }
        .prize-2 { transform: rotate(67.5deg); }
        .prize-3 { transform: rotate(112.5deg); }
        .prize-4 { transform: rotate(157.5deg); }
        .prize-5 { transform: rotate(202.5deg); }
        .prize-6 { transform: rotate(247.5deg); }
        .prize-7 { transform: rotate(292.5deg); }
        .prize-8 { transform: rotate(337.5deg); }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-8">
            <h1>幸运大转盘</h1>
            <p>点击开始，赢取丰厚奖品</p>
        </div>
        
        <div class="turntable-container">
            <!-- 转盘背景 -->
            <div id="turntable" class="turntable">
                <!-- 转盘扇形区域 -->
                <div class="prize-section sector-1" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
                <div class="prize-section sector-2" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
                <div class="prize-section sector-3" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
                <div class="prize-section sector-4" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
                <div class="prize-section sector-5" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
                <div class="prize-section sector-6" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
                <div class="prize-section sector-7" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
                <div class="prize-section sector-8" style="clip-path: polygon(50% 50%, 100% 0, 100% 50%);"></div>
                
                <!-- 转盘奖品文字 -->
                <div class="prize-section prize-1">一等奖</div>
                <div class="prize-section prize-2">二等奖</div>
                <div class="prize-section prize-3">三等奖</div>
                <div class="prize-section prize-4">四等奖</div>
                <div class="prize-section prize-5">五等奖</div>
                <div class="prize-section prize-6">六等奖</div>
                <div class="prize-section prize-7">七等奖</div>
                <div class="prize-section prize-8">八等奖</div>
            </div>
            
            <!-- 转盘中心按钮 -->
            <button id="spinBtn" class="spin-btn">
                <i class="fa fa-play"></i>
            </button>
            
            <!-- 转盘指针 -->
            <div class="pointer"></div>
        </div>
        
        <!-- 结果显示区域 -->
        <div id="result" class="result-container">
            <div class="result-title">恭喜您获得</div>
            <div id="prizeResult" class="prize-result"></div>
        </div>
        
        <!-- 状态指示器 -->
        <div id="status" class="status">准备就绪，点击开始</div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const turntable = document.getElementById('turntable');
            const spinBtn = document.getElementById('spinBtn');
            const result = document.getElementById('result');
            const prizeResult = document.getElementById('prizeResult');
            const status = document.getElementById('status');
            
            let isSpinning = false;
            let rotation = 0;
            let animationFrameId = null;
            let endRotation = 0;
            let startTime = null;
            let animationDuration = 1500; // 动画持续时间（毫秒）
            
            // 模拟请求延迟
            const simulateApiRequest = () => {
                return new Promise((resolve) => {
                    // 模拟1-3秒的请求延迟
                    const delay = Math.random() * 2000 + 1000;
                    
                    setTimeout(() => {
                        // 随机生成一个结果（0-7表示8个奖项）
                        const prizeIndex = Math.floor(Math.random() * 8);
                        console.log('????', prizeIndex);
                        resolve(prizeIndex);
                    }, delay);
                });
            };
            
            // 计算结束位置（确保指针指向正确的奖品）
            const calculateEndRotation = (prizeIndex) => {
                // 至少旋转5圈，增加趣味性
                const minRotations = 5;
                
                // 每个奖品占45度
                const prizeAngle = 45;
                
                // 计算结束角度（确保指针指向对应奖品的中心）
                const endAngle = (360 * minRotations) + (prizeIndex * prizeAngle) + 22.5;
                
                return endAngle;
            };
            
            // Easing函数 - 加速
            const easeIn = (t) => t * t;
            
            // Easing函数 - 减速
            const easeOut = (t) => t * (2 - t);


            let simulatePrizeIndex = -1;
            
            // 加速阶段动画
            const animateAcceleration = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / animationDuration, 1);
                const easedProgress = easeIn(progress);
                
                // 从0度加速到1080度（3圈）
                rotation = 1080 * easedProgress;
                turntable.style.transform = `rotate(${rotation}deg)`;

                console.log(progress)
                
                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animateAcceleration);
                } else {
                    status.textContent = '正在旋转...';
                    simulateApiRequest().then((prizeIndex) => {
                        simulatePrizeIndex = prizeIndex;
                    });
                    // 加速阶段完成，进入匀速阶段
                    startLinearRotation();
                }
            };

            
            // 匀速旋转
            const startLinearRotation = () => {
                // 发送请求
                
                console.log('???? simulatePrizeIndex', simulatePrizeIndex)

                if (simulatePrizeIndex === -1) {
                    rotation = rotation + 10;
                    turntable.style.transform = `rotate(${rotation}deg)`;
                    animationFrameId = requestAnimationFrame(startLinearRotation);
                } else {
                    status.textContent = '等待结果...';
                    // 记录当前旋转角度
                    const computedStyle = getComputedStyle(turntable);
                    const matrix = new DOMMatrix(computedStyle.transform);
                    rotation = Math.atan2(matrix.b, matrix.a) * (180 / Math.PI);
                    
                    // 计算最终停止位置
                    endRotation = calculateEndRotation(simulatePrizeIndex);
                    
                    // 开始减速动画
                    startTime = null;
                    animationFrameId = requestAnimationFrame(animateDeceleration);
                }
            };
            
            // 减速阶段动画
            const animateDeceleration = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / animationDuration, 1);
                const easedProgress = easeOut(progress);
                
                // 从当前角度减速到目标角度
                const currentRotation = rotation + (endRotation - rotation) * easedProgress;
                turntable.style.transform = `rotate(${currentRotation}deg)`;
                
                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animateDeceleration);
                } else {
                    // 动画完成，显示结果
                    const prizes = ['一等奖', '二等奖', '三等奖', '四等奖', '五等奖', '六等奖', '七等奖', '八等奖'];
                    prizeResult.textContent = prizes[Math.floor((endRotation % 360) / 45)];
                    result.style.display = 'block';
                    status.textContent = '旋转完成';
                    
                    // 重置按钮
                    spinBtn.disabled = false;
                    spinBtn.innerHTML = '<i class="fa fa-refresh"></i>';
                    
                    isSpinning = false;
                }
            };
            
            // 开始旋转
            const startSpin = () => {
                if (isSpinning) return;
                
                isSpinning = true;
                spinBtn.disabled = true;
                result.style.display = 'none';
                
                // 重置状态
                rotation = 0;
                startTime = null;
                cancelAnimationFrame(animationFrameId);
                
                // 开始加速动画
                animationFrameId = requestAnimationFrame(animateAcceleration);
            };
            
            // 绑定点击事件
            spinBtn.addEventListener('click', startSpin);
        });
    </script>
</body>
</html>
